    - name: Sync LOS 18.1
      run: |
        mkdir -p ~/android/lineage
        cd ~/android/lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --git-lfs --depth=1
        # Copy manifest dari repo ini, jangan bikin manual lagi
        cp $GITHUB_WORKSPACE/local_manifests/A57.xml .repo/local_manifests/
        cat .repo/local_manifests/A57.xml
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        echo "=== CEK DEVICE ==="
        ls -la device/oppo/A57/

    - name: Backport fix dari 22.1 (kamera + IMEI + lockscreen)
      run: |
        cd ~/android/lineage
        # PATH BENER, JANGAN PAKE lineage/device/ LAGI
        cd device/oppo/A57
        pwd
        ls -la
        # taruh script backport kamu di sini
