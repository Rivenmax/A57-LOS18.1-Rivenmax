name: Build LOS 18.1 for OPPO A57 (Rivenmax release-keys)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p ~/bin && curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "Rivenmax"
          git config --global user.email "rivenmax22@gmail.com"
      - name: Sync LOS 18.1
        run: |
          mkdir -p lineage && cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --git-lfs --depth=1
          cp -r $GITHUB_WORKSPACE/local_manifests/*.xml .repo/local_manifests/
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      - name: Backport fix dari 22.1 (kamera + IMEI + lockscreen)
        run: |
          cd lineage/device/oppo/A57
          git remote add tipz22 https://codeberg.org/TipzTeam/android_device_oppo_A57.git || true
          git fetch tipz22 lineage-22.1 --depth=20 || true
          for f in fstab.qcom init.qcom.rc overlay/powerhint.json proprietary-files.txt; do
            git show tipz22/lineage-22.1:$f > /tmp/fix_$(basename $f) 2>/dev/null && cp /tmp/fix_$(basename $f) $f || echo "SKIP $f"
          done
      - name: Generate Rivenmax release-keys
        run: |
          cd lineage
          mkdir -p vendor/lineage-priv/keys
          openssl genrsa -out vendor/lineage-priv/keys/releasekey.pem 2048
          openssl req -new -x509 -key vendor/lineage-priv/keys/releasekey.pem -out vendor/lineage-priv/keys/releasekey.x509.pem -days 10000 -subj "/C=ID/ST=Jawa Tengah/L=Sukoharjo/O=Rivenmax/CN=Rivenmax"
          ls -lh vendor/lineage-priv/keys/
      - name: Build
        run: |
          cd lineage
          source build/envsetup.sh
          export USE_CCACHE=1
          lunch lineage_A57-userdebug
          mka bacon -j$(nproc --all)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lineage-18.1-Rivenmax-A57
          path: lineage/out/target/product/A57/*.zip
