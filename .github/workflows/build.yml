name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      SYNC_DIR: /home/runner/work/A57-LOS18.1-Rivenmax/A57-LOS18.1-Rivenmax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Agresif
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Manifest
        run: |
          mkdir -p $SYNC_DIR
          cd $SYNC_DIR
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --git-lfs --depth=1 || repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1

      - name: Setup Local Manifest - Pake Nama Asli Dari Foto Lu
        run: |
          mkdir -p $SYNC_DIR/.repo/local_manifests
          cat > $SYNC_DIR/.repo/local_manifests/A57.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Rivenmax/android_device_oppo_A57" path="device/oppo/A57" remote="github" revision="lineage-18.1" />
            <project name="Rivenmax/android_device_oppo_thortanium-common" path="device/oppo/thortanium-common" remote="github" revision="lineage-22.1" />
            <project name="Rivenmax/android_kernel_oppo_msm8937" path="kernel/oppo/msm8937" remote="github" revision="lineage-18.1-k4.9" />
            <project name="Rivenmax/proprietary_vendor_oppo_A57" path="vendor/oppo/A57" remote="github" revision="lineage-22.1" />
            <project name="Rivenmax/proprietary_vendor_oppo_thortanium-common" path="vendor/oppo/thortanium-common" remote="github" revision="lineage-22.1" />
          </manifest>
          EOF
          cat $SYNC_DIR/.repo/local_manifests/A57.xml

      - name: Sync
        run: |
          cd $SYNC_DIR
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all) || repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4
          df -h

      - name: Ambil Fix Dari 22.1 Yang Udah Jadi - Cuma 3 Fix Doang
        run: |
          cd $SYNC_DIR
          mkdir -p /tmp/fix221
          cd /tmp/fix221
          git clone --depth 1 --branch lineage-22.1 https://github.com/TipzTeam/android_device_oppo_A57.git fix221 || git clone --depth 1 --branch lineage-22.1 https://codeberg.org/TipzTeam/android_device_oppo_A57.git fix221
          cd $SYNC_DIR
          cp /tmp/fix221/rootdir/etc/fstab.qcom device/oppo/A57/rootdir/etc/fstab.qcom || echo "fstab sudah sama"
          cp /tmp/fix221/rootdir/etc/init.qcom.rc device/oppo/A57/rootdir/etc/init.qcom.rc || echo "init sudah sama"
          cp -r /tmp/fix221/overlay/* device/oppo/A57/overlay/ 2>/dev/null || echo "overlay sudah sama"
          echo "3 Fix dari 22.1 udah ditempel ke 18.1 - Kernel tetep 4.9"

      - name: Patch sensorservice biar nggak Werror
        run: |
          cd $SYNC_DIR
          find frameworks/hardware/interfaces/sensorservice -name "Android.bp" -exec sed -i 's/-Werror/-Wno-error/g' {} \; || true
          echo "Patched sensorservice"

      - name: Patch thortanium-common 22.1 jadi 18.1
        run: |
          cd $SYNC_DIR
          # Hapus install_symlink + relative_install_path yang cuma ada di 22.1
          find device/oppo/thortanium-common vendor/oppo/thortanium-common -name "Android.bp" -exec sed -i '/relative_install_path/d' {} \; || true
          # Hapus blok install_symlink di Android.bp pake python
          python3 -c "
          import pathlib, re
          for p in list(pathlib.Path('device/oppo/thortanium-common').rglob('Android.bp')) + list(pathlib.Path('vendor/oppo/thortanium-common').rglob('Android.bp')):
              t = p.read_text(errors='ignore')
              # Hapus modul install_symlink sampe kurung tutup
              t = re.sub(r'install_symlink\s*\{[^}]*\},?', '', t, flags=re.DOTALL)
              p.write_text(t)
              print('patched', p)
          "
          echo "Patched thortanium-common Soong"

      - name: Pakai Key Rivenmax - Real Release-Keys
        run: |
          cd $SYNC_DIR
          mkdir -p vendor/lineage-priv/keys
          echo "${{ secrets.RIVENMAX_RELEASEKEY }}" > vendor/lineage-priv/keys/releasekey.pem
          echo "${{ secrets.RIVENMAX_RELEASEKEY_X509 }}" > vendor/lineage-priv/keys/releasekey.x509.pem
          chmod 600 vendor/lineage-priv/keys/releasekey.pem
          ls -l vendor/lineage-priv/keys/
          echo "Key Rivenmax terpasang - nanti jadi real release-keys"

      - name: Build
        run: |
          cd $SYNC_DIR
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/home/runner/.ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          export PRODUCT_DEFAULT_DEV_CERTIFICATE=vendor/lineage-priv/keys/releasekey
          ccache -M 10G
          ccache -z
          df -h
          source build/envsetup.sh
          lunch lineage_A57-userdebug
          mka bacon -j$(nproc --all)

      - name: Rename ke Rivenmax
        run: |
          cd $SYNC_DIR/out/target/product/A57
          ls -lh *.zip
          for f in lineage-*.zip; do mv "$f" "LOS-18.1-A57-Rivenmax.zip"; done
          ls -lh *.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LOS-18.1-A57-Rivenmax
          path: |
            ${{ env.SYNC_DIR }}/out/target/product/A57/*.zip
            ${{ env.SYNC_DIR }}/out/target/product/A57/*.img
          if-no-files-found: error
